# Liga/desliga o runtime efêmero (ADR-0010): Event Hubs + Capture, AKS + Flux, Postgres, identidades.
#   Actions > env > Run workflow > action: up | down
# Guarda-corpo de custo: toda noite (00:00 BRT) o runtime é destruído automaticamente.
name: env

on:
  workflow_dispatch:
    inputs:
      action:
        description: up (cria/atualiza o runtime) ou down (destrói o runtime)
        type: choice
        options: [up, down]
        default: up
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC = 00:00 BRT

permissions:
  contents: read
  id-token: write

concurrency:
  group: env-runtime-dev
  cancel-in-progress: false

jobs:
  runtime:
    if: vars.AZURE_CLIENT_ID != ''
    uses: ViniciusOtoni/platform-cicd-workflows/.github/workflows/cd-terraform.yml@v1
    with:
      working-directory: stacks/runtime
      environment-name: dev
      destroy: ${{ github.event_name == 'schedule' || inputs.action == 'down' }}
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
