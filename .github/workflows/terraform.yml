# CI: validate em tudo; plan dos stacks no PR (comentado).
# CD: apply dos stacks PERSISTENTES (foundation -> lakehouse) no merge.
# O stack runtime (efêmero) NÃO é aplicado aqui: ele sobe/desce pelo workflow "env" (ADR-0010).
name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  ci-stacks:
    strategy:
      fail-fast: false
      matrix:
        stack: [foundation, lakehouse, runtime]
    uses: ViniciusOtoni/platform-cicd-workflows/.github/workflows/ci-terraform.yml@v1
    with:
      working-directory: stacks/${{ matrix.stack }}
      environment-name: dev
      run-plan: ${{ github.event_name == 'pull_request' }}
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  ci-modules:
    strategy:
      fail-fast: false
      matrix:
        dir: [bootstrap, modules/domain-data, modules/domain-runtime]
    uses: ViniciusOtoni/platform-cicd-workflows/.github/workflows/ci-terraform.yml@v1
    with:
      working-directory: ${{ matrix.dir }}
      run-plan: false

  cd-foundation:
    needs: [ci-stacks, ci-modules]
    if: github.event_name == 'push' && vars.AZURE_CLIENT_ID != ''
    uses: ViniciusOtoni/platform-cicd-workflows/.github/workflows/cd-terraform.yml@v1
    with:
      working-directory: stacks/foundation
      environment-name: dev
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  cd-lakehouse:
    needs: cd-foundation
    uses: ViniciusOtoni/platform-cicd-workflows/.github/workflows/cd-terraform.yml@v1
    with:
      working-directory: stacks/lakehouse
      environment-name: dev
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
